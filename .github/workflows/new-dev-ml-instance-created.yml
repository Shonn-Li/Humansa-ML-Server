name: Deploy Dev ML Server

on:
  push:
    branches:
      - dev

jobs:
  setup_instance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3
          ansible-galaxy collection install community.aws
          ansible-galaxy collection install amazon.aws --force
          ansible-galaxy collection install community.docker --force

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up AWS credentials for Ansible
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id = ${{ secrets.AWS_DEPLOY_ACCESS_KEY }}
          aws_secret_access_key = ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          EOF
          cat > ~/.aws/config << EOF
          [default]
          region = ${{ secrets.AWS_REGION }}
          EOF

      - name: Set Up SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > deploy_key.pem
          chmod 600 deploy_key.pem

      - name: Build and push Docker image
        run: |
          # Set image tag based on commit SHA
          IMAGE_TAG="${GITHUB_SHA:0:7}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_ENV

          # Build and push image
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/shonn-li/youwoai-ml-server:${IMAGE_TAG} .
          docker push ghcr.io/shonn-li/youwoai-ml-server:${IMAGE_TAG}

          # Update SSM parameter with new image tag
          aws ssm put-parameter \
            --name /youwoai/dev/ml_server_image_tag \
            --value ${IMAGE_TAG} \
            --type String \
            --overwrite

      - name: Create dynamic inventory file
        run: |
          # Get all running instances in dev ML ASG
          INSTANCES=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:autoscaling:groupName,Values=youwoai-dev-ml-asg" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].[InstanceId,PublicIpAddress]' \
            --output text)

          # Create inventory file
          cat > target_inventory.yml << EOF
          all:
            children:
              asg_youwoai_dev_ml_asg:
                hosts:
          EOF

          # Add each instance to inventory
          echo "$INSTANCES" | while read instance_id public_ip; do
            cat >> target_inventory.yml << EOF
                  ${instance_id}:
                    ansible_host: ${public_ip}
                    ansible_user: ec2-user
                    ansible_ssh_private_key_file: deploy_key.pem
                    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
          EOF
          done

          echo "Created inventory with instances:"
          cat target_inventory.yml

      - name: Run Ansible Playbook on all dev ML instances
        run: |
          ansible-playbook -i target_inventory.yml dev-ml-playbook.yml --extra-vars "
            aws_deploy_access_key=${{ secrets.AWS_DEPLOY_ACCESS_KEY }}
            aws_deploy_secret_access_key=${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
            aws_region=${{ secrets.AWS_REGION }}
            ghcr_username=${{ github.actor }}
            ghcr_token=${{ secrets.GITHUB_TOKEN }}
            ghcr_repository=shonn-li/youwoai-ml-server
            image_tag=${{ env.image_tag }}
            openai_api_key=${{ secrets.OPENAI_API_KEY }}
            aws_access_key=${{ secrets.AWS_ACCESS_KEY }}
            aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            webshare_proxy_password=${{ secrets.WEBSHARE_PROXY_PASSWORD }}
            webshare_proxy_username=${{ secrets.WEBSHARE_PROXY_USERNAME }}
            xai_api_key=${{ secrets.XAI_API_KEY }}
            google_api_key=${{ secrets.GOOGLE_API_KEY }}
            anthropic_api_key=${{ secrets.ANTHROPIC_API_KEY }}
            deepseek_api_key=${{ secrets.DEEPSEEK_API_KEY }}
            azure_inference_endpoint=${{ secrets.AZURE_INFERENCE_ENDPOINT }}
            azure_inference_credential=${{ secrets.AZURE_INFERENCE_CREDENTIAL }}"  || [ $? -eq 2 ]
