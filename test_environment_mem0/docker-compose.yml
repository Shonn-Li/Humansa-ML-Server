version: '3.8'

services:
  # PostgreSQL with pgvector for Mem0
  postgres-mem0:
    image: pgvector/pgvector:pg15
    container_name: humansa-mem0-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: humansa_mem0_test
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5455:5432"  # Different port to avoid conflicts
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - postgres-mem0-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d humansa_mem0_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - humansa-test-network

  # ML Server with Mem0 integration
  ml-server-mem0:
    build:
      context: ../
      dockerfile: Dockerfile.test
    container_name: humansa-mem0-ml-server
    environment:
      # Database config
      DB_HOST: postgres-mem0
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: humansa_mem0_test
      
      # Azure OpenAI config (use test keys or mock)
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-test-key}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-https://test.openai.azure.com}
      AZURE_OPENAI_DEPLOYMENT_GPT4: ${AZURE_OPENAI_DEPLOYMENT_GPT4:-gpt-4}
      AZURE_OPENAI_DEPLOYMENT_EMBEDDING: ${AZURE_OPENAI_DEPLOYMENT_EMBEDDING:-text-embedding-ada-002}
      
      # Mem0 config
      MEM0_SCHEMA: mem0_test
      MEM0_COLLECTION_NAME: humansa_test_memories
      
      # Test environment flag
      ENVIRONMENT: test
      
      # Logging
      LOG_LEVEL: DEBUG
    ports:
      - "5002:5001"  # Different port for test ML server
    depends_on:
      postgres-mem0:
        condition: service_healthy
    volumes:
      - ./test-data:/app/test-data
      - ../src:/app/src  # Mount source code for hot reload
    networks:
      - humansa-test-network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        python -m pytest test_mem0_integration.py -v --tb=short ||
        python -m src.main
      "

  # Optional: Redis for caching
  redis-mem0:
    image: redis:7-alpine
    container_name: humansa-mem0-redis
    ports:
      - "6380:6379"
    networks:
      - humansa-test-network

networks:
  humansa-test-network:
    driver: bridge

volumes:
  postgres-mem0-data: