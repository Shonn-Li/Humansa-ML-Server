name: Setup New ML EC2 Instance

on:
  repository_dispatch:
    types: [new-ml-instance-created]

jobs:
  setup_instance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3
          ansible-galaxy collection install community.aws
          ansible-galaxy collection install amazon.aws --force
          ansible-galaxy collection install community.docker --force

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up AWS credentials for Ansible
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id = ${{ secrets.AWS_DEPLOY_ACCESS_KEY }}
          aws_secret_access_key = ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          EOF
          cat > ~/.aws/config << EOF
          [default]
          region = ${{ secrets.AWS_REGION }}
          EOF

      - name: Set Up SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > deploy_key.pem
          chmod 600 deploy_key.pem

      - name: Get latest image tag from SSM
        id: get_image_tag
        run: |
          IMAGE_TAG=$(aws ssm get-parameter --name /youwoai/prod/ml_server_image_tag --query 'Parameter.Value' --output text)
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Create targeted inventory file
        run: |
          cat > target_inventory.yml << EOF
          all:
            children:
              asg_youwoai_ml_asg:
                hosts:
                  "${{ github.event.client_payload.instance_id }}":
                    ansible_host: "${{ github.event.client_payload.instance_id }}"
                    ansible_user: ec2-user
                    ansible_ssh_private_key_file: deploy_key.pem
                    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
          EOF

      - name: Wait for instance to be ready
        run: |
          # Get public IP of the instance
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids ${{ github.event.client_payload.instance_id }} --query 'Reservations[0].Instances[0].PublicIpAddress' --output text --region ${{ github.event.client_payload.region }})
          echo "Waiting for instance ${{ github.event.client_payload.instance_id }} (${PUBLIC_IP}) to be ready for SSH..."

          # Replace inventory IP
          sed -i "s/ansible_host: \"${{ github.event.client_payload.instance_id }}\"/ansible_host: \"${PUBLIC_IP}\"/" target_inventory.yml

          # Wait for SSH to be available
          for i in {1..30}; do
            if nc -z -w5 ${PUBLIC_IP} 22; then
              echo "SSH is available!"
              break
            fi
            echo "Waiting for SSH... (attempt $i/30)"
            sleep 10
          done

      - name: Run Ansible Playbook on specific instance
        run: |
          ansible-playbook -i target_inventory.yml ml-playbook.yml --extra-vars "
            aws_deploy_access_key=${{ secrets.AWS_DEPLOY_ACCESS_KEY }}
            aws_deploy_secret_access_key=${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
            aws_region=${{ secrets.AWS_REGION }}
            ghcr_username=${{ github.actor }}
            ghcr_token=${{ secrets.GITHUB_TOKEN }}
            ghcr_repository=shonn-li/youwoai-ml-server
            image_tag=${{ env.image_tag }}
            openai_api_key=${{ secrets.OPENAI_API_KEY }}
            aws_access_key=${{ secrets.AWS_ACCESS_KEY }}
            aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            WEBSHARE_PROXY_PASSWORD=${{ secrets.WEBSHARE_PROXY_PASSWORD }}
            WEBSHARE_PROXY_USERNAME=${{ secrets.WEBSHARE_PROXY_USERNAME }}"  || [ $? -eq 2 ]
