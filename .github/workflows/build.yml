name: Build and Push ML Server Docker Image

on:
  push:
    tags:
      - "build-*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version number
        id: get_version
        run: echo "version=$(echo ${{ github.ref }} | sed -e 's|refs/tags/build-||')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/shonn-li/youwoai-ml-server:${{ env.version }}

      - name: Pull the Docker image to verify permissions
        run: |
          docker pull ghcr.io/shonn-li/youwoai-ml-server:${{ env.version }}
          docker images
