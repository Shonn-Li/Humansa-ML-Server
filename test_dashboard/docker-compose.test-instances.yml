      retries: 5
    networks:
      - test_network

  # Test Instance 4 - Port 5064
  test-db-4:
    image: pgvector/pgvector:pg15
    container_name: humansa_test_db_4
    environment:
      POSTGRES_USER: youwo
      POSTGRES_PASSWORD: youwo123
