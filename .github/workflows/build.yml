name: "[DEPRECATED] Build ML Server Docker Image - Use release-* tags instead"

# This workflow is deprecated. Use release-* tags instead of build-* tags.
# The release workflow now handles both building and deployment.

on:
  push:
    tags:
      - "build-*"

jobs:
  deprecated-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Deprecated workflow notice
        run: |
          echo "⚠️  This build workflow is DEPRECATED!"
          echo "Please use 'release-*' tags instead of 'build-*' tags."
          echo "The release workflow now handles both building and deployment sequentially."
          echo "Example: git tag release-1.0.0 && git push origin release-1.0.0"
          exit 1
