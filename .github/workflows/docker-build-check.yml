name: Docker Build Check

on:
  push:
    branches: [ main ]
    paths:
      - 'requirements.txt'
      - 'Dockerfile'
      - 'src/**'
      - '.github/workflows/docker-build-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'requirements.txt'
      - 'Dockerfile'
      - 'src/**'
      - '.github/workflows/docker-build-check.yml'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Validate Docker Build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          
      - name: Build Docker image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ml-server-test:amd64
          
      - name: Build Docker image (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ml-server-test:arm64
          
      - name: Success message
        if: success()
        run: |
          echo "✅ Docker build successful! All dependencies installed correctly."
          echo "The image can be built for both linux/amd64 and linux/arm64 platforms."
          
      - name: Failure message
        if: failure()
        run: |
          echo "❌ Docker build failed! Check the logs above for dependency errors."
          echo "Common issues:"
          echo "- Package version doesn't exist in PyPI"
          echo "- Python version compatibility issues"
          echo "- Missing system dependencies"
          exit 1