version: '3.8'

services:
  # Test Instance 1 - Port 5061
  test-db-1:
    image: pgvector/pgvector:pg15
    container_name: humansa_test_db_1
    environment:
      POSTGRES_USER: youwo
      POSTGRES_PASSWORD: youwo123
      POSTGRES_DB: youwoai
    ports:
      - "5061:5432"
    volumes:
      - test_db_1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youwo -d youwoai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test_network

  # Test Instance 2 - Port 5062
  test-db-2:
    image: pgvector/pgvector:pg15
    container_name: humansa_test_db_2
