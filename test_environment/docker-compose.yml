version: '3.8'

services:
  postgres-test:
    image: pgvector/pgvector:pg15
    container_name: youwoai_test_db
    ports:
      - "5454:5432"  # Different port to avoid conflicts
    environment:
      POSTGRES_DB: youwoai_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 031203
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d youwoai_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - test_network

volumes:
  test_pgdata:
    name: youwoai_test_pgdata

networks:
  test_network:
    name: youwoai_test_network
    driver: bridge